name: Sync to Hugging Face

on:
  push:
    branches: [main, master]

# প্রাইভেট রেপোর ফাইল পড়ার জন্য এই পারমিশনটুকু লাগবে
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git push --force https://Madarauchihagmailcom:$HF_TOKEN@huggingface.co/spaces/Madarauchihagmailcom/MyMail main
          
